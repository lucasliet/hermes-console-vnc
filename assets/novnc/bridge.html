<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hermes Screen</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  #screen { width: 100%; height: 100%; }
  #overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.72); color: #ddd; font: 14px/1.4 system-ui, sans-serif;
    text-align: center; padding: 24px; z-index: 10; transition: opacity .25s;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="screen"></div>
<div id="overlay">Connecting…</div>
<script type="module">
import RFB from './core/rfb.js';

const overlay = document.getElementById('overlay');
const params = new URLSearchParams(location.search);
const wsUrl = params.get('ws');
const text = {
  connecting: params.get('connecting') || 'Connecting…',
  missing: params.get('missing') || 'Display URL missing',
  closed: params.get('closed') || 'Session ended',
  lost: params.get('lost') || 'Connection lost. Tap to reconnect.',
  security: params.get('security') || 'Security failure',
  credentials: params.get('credentials') || 'The display asked for credentials',
};

function show(token, label) {
  overlay.textContent = label || '';
  overlay.classList.toggle('hidden', !label);
  if (token === 'lost') overlay.dataset.reload = '1';
  else delete overlay.dataset.reload;
  try {
    if (window.TakeoverChannel) window.TakeoverChannel.postMessage(token);
  } catch (error) {}
}

if (!wsUrl) {
  show('missing', text.missing);
} else {
  overlay.textContent = text.connecting;
  const rfb = new RFB(document.getElementById('screen'), wsUrl, {});
  rfb.scaleViewport = true;
  rfb.resizeSession = false;
  rfb.clipViewport = true;
  rfb.addEventListener('connect', () => show('connected', ''));
  rfb.addEventListener('disconnect', (event) => {
    if (event.detail.clean) show('closed', text.closed);
    else show('lost', text.lost);
  });
  rfb.addEventListener('securityfailure', () => show('security', text.security));
  rfb.addEventListener('credentialsrequired', () => show('credentials', text.credentials));
  overlay.addEventListener('click', () => {
    if (overlay.dataset.reload === '1') {
      try {
        if (window.TakeoverChannel) window.TakeoverChannel.postMessage('reconnect');
      } catch (error) {}
    }
  });
}
</script>
</body>
</html>
